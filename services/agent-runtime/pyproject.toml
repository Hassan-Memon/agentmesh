[project]
name = "agentmesh-runtime"
version = "0.1.0"
description = "AgentMesh Python agent runtime: gRPC server hosting LangGraph agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "agentmesh-bus",
    "grpcio>=1.66",
    "protobuf>=5.26",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Local embeddings without any API. Heavy (torch), so opt in explicitly.
local-embeddings = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentmesh_runtime"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv.sources]
agentmesh-bus = { path = "../../packages/bus", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["agentmesh_runtime/proto_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
